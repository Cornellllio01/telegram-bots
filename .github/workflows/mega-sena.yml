name: Notificar resultado Mega-Sena

on:
 schedule:
    # Terça e quinta: sorteio às 21h BRT (0h UTC do dia seguinte), com folga
    - cron: '0 23 * * 2,4'
    - cron: '30 23 * * 2,4'
    - cron: '0 0 * * 3,5'
    # Domingo: sorteio agora é às 11h BRT (14h UTC), não mais sábado à noite
    - cron: '0 14 * * 0'
    - cron: '30 14 * * 0'
    - cron: '0 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r mega-sena/requirements.txt

      - name: Rodar notificador
        working-directory: mega-sena
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notificar_mega_sena.py

      - name: Commit do último concurso notificado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mega-sena/ultimo_concurso.json
          git diff --staged --quiet || git commit -m "chore: registrar concurso notificado $(date +'%d/%m/%Y')"
          git push
