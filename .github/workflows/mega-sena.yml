name: Notificar resultado Mega-Sena

on:
  schedule:
    # Mega-Sena costuma sortear às 20h BRT (23h UTC), terças, quintas e sábados.
    # Roda algumas vezes no fim da tarde/noite pra pegar o resultado assim que sair.
    - cron: '0 23 * * 2,4,6'
    - cron: '30 23 * * 2,4,6'
    - cron: '0 0 * * 3,5,0'
  workflow_dispatch:  # permite rodar manualmente

permissions:
  contents: write

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r mega-sena/requirements.txt

      - name: Rodar notificador
        working-directory: mega-sena
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notificar_mega_sena.py

      - name: Commit do último concurso notificado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mega-sena/ultimo_concurso.json
          git diff --staged --quiet || git commit -m "chore: registrar concurso notificado $(date +'%d/%m/%Y')"
          git push
